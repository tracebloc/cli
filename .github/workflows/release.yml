# Build, sign, and publish the official tracebloc CLI binaries.
#
# Triggered by pushing a vX.Y.Z tag (or manually via
# workflow_dispatch). Produces:
#
#   - Cross-compiled binaries for linux/{amd64,arm64,386,arm},
#     darwin/{amd64,arm64}, windows/{amd64,arm64}
#   - Cosign keyless signature for each binary (Sigstore Rekor;
#     same machinery as tracebloc/data-ingestors' image release)
#   - SHA256SUMS file covering every binary
#   - install.sh + install.ps1 attached so the bootstrap URL
#     `https://github.com/tracebloc/cli/releases/latest/download/install.sh`
#     resolves to the right script for that release
#   - GitHub Release with all of the above attached + release-notes
#     body auto-generated by GitHub from the merged PRs
#     (generate_release_notes: true — there is no CHANGELOG.md)
#
# Verification (one-liner customers run to check the signature):
#
#   cosign verify-blob \
#     --certificate-identity-regexp \
#       'https://github.com/tracebloc/cli/.github/workflows/release.yml@refs/tags/v.*' \
#     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
#     --certificate <binary>.cert \
#     --signature <binary>.sig \
#     <binary>

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Rebuilds: dispatch the workflow AT the tag ref (Actions -> Run workflow ->
  # pick the v* tag), or gh run rerun a previous tag run. Cosign embeds the
  # RUN's ref in the keyless identity; the installers only trust
  # @refs/tags/v.*, so a branch-dispatched "rebuild of a tag" would publish
  # signatures every customer install rejects (Bugbot on promotion #428).
  workflow_dispatch: {}

permissions:
  contents: write  # create / update the GitHub Release
  id-token: write  # cosign keyless OIDC

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pre-flight: reject a branch-misdispatch ONCE, in seconds, before the 8-way
  # matrix spins up (review nit on #429). Ref passed via env, never inline.
  guard:
    name: Ref guard
    runs-on: ubuntu-latest
    env:
      REF_FULL: ${{ github.ref }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Dispatch rebuilds must run at a v* tag ref
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && ! printf '%s' "$REF_FULL" | grep -qE '^refs/tags/v'; then
            echo "::error::rebuilds must be dispatched from the v* tag itself (Actions -> Run workflow -> select the tag), not a branch -- signatures would embed $REF_FULL and fail every customer verification."
            exit 1
          fi
          echo "ref ok: $REF_FULL"

  release:
    timeout-minutes: 20
    name: Build + sign + publish
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: '386'
          - os: linux
            arch: arm
            goarm: '6'   # armv6 baseline runs on armv6 + armv7 (Pi Zero → Pi 4)
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
            ext: .exe
          - os: windows
            arch: arm64
            ext: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
        with:
          cosign-release: 'v2.4.1'

      - name: Determine release version
        id: version
        env:
          # Passed via env, never interpolated into the script: git permits $/
          # backticks in tag names and a crafted v* tag would otherwise execute
          # on the runner (R8; same rule as the client installer workflows).
          REF_NAME: ${{ github.ref_name }}
        run: |
          # github.ref_name = "v0.1.0" (tag push, or dispatch AT the tag ref)
          REF="$REF_NAME"
          # Strip the leading v for use in -X main.version
          VERSION="${REF#v}"
          # The VERSION file declares the next release (read by the release
          # train to cut rc/final tags). Any tag -- train-cut OR manual --
          # must agree with it, so the file can never go silently stale
          # after an out-of-train release. Refs from before the file existed
          # (rebuilds of old tags) are grandfathered with a warning.
          BASE=$(printf '%s' "$VERSION" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
          if [ -f VERSION ]; then
            FILE_VERSION=$(tr -d '[:space:]' < VERSION)
            if [ "$BASE" != "$FILE_VERSION" ]; then
              echo "::error::tag $REF (base $BASE) does not match VERSION ($FILE_VERSION) - bump VERSION on develop first."
              exit 1
            fi
          else
            echo "::warning::no VERSION file at this ref (pre-train tag) - skipping the consistency check."
          fi
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $REF (version=$VERSION)"

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          # GOARM only applies when GOARCH=arm; empty for every other
          # target, which Go ignores.
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          BIN_NAME="tracebloc-${{ steps.version.outputs.tag }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          go build \
            -trimpath \
            -ldflags "\
              -s -w \
              -X main.version=${{ steps.version.outputs.version }} \
              -X main.gitSHA=${GITHUB_SHA:0:12} \
              -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/$BIN_NAME" \
            ./cmd/tracebloc
          echo "Binary built: dist/$BIN_NAME"
          ls -lh "dist/$BIN_NAME"

      - name: Sign binary with cosign (keyless)
        # Via scripts/cosign-retry.sh, NOT a bare `cosign` (backend#2379).
        # sign-blob is a call to a third-party CDN with no local alternative,
        # and on 2026-08-23 a single sigstore TUF reset on this one leg left
        # v0.10.10-rc.2 a git tag with no Release and no assets for 6h04m —
        # because `publish` below is (correctly) gated on ALL eight legs.
        #
        # The retry is deliberately HERE, on the one network call, and not a
        # job-level re-run: re-running redoes seven good legs and widens the
        # very window this closes. The `needs: release` gate on `publish` is
        # NOT the bug and must stay — a release missing darwin/arm64 is worse
        # than no release — so the wrapper fails closed: bounded attempts,
        # transient-only retries, and a zero exit with no .sig still fails.
        # Properties pinned by scripts/tests/cosign-retry-verify.sh.
        env:
          # Required for keyless signing in GHA. The id-token: write
          # permission above grants the workflow an OIDC token Sigstore
          # validates against github.com's well-known issuer.
          COSIGN_YES: 'true'
        run: |
          BIN_NAME="tracebloc-${{ steps.version.outputs.tag }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          cd dist
          "$GITHUB_WORKSPACE/scripts/cosign-retry.sh" sign-blob \
            --output-certificate "$BIN_NAME.cert" \
            --output-signature "$BIN_NAME.sig" \
            "$BIN_NAME"
          echo "Signed: $BIN_NAME"
          ls -lh "$BIN_NAME"*

      - name: Compute SHA256
        run: |
          BIN_NAME="tracebloc-${{ steps.version.outputs.tag }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          cd dist
          # Per-binary SHA256 file. The release step aggregates them
          # into a single SHA256SUMS that the install.sh script reads.
          sha256sum "$BIN_NAME" > "$BIN_NAME.sha256"
          cat "$BIN_NAME.sha256"

      - name: Upload per-matrix artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    timeout-minutes: 20
    name: Aggregate + create GitHub Release
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Download all matrix artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/
          merge-multiple: true

      - name: Aggregate SHA256SUMS
        run: |
          cd dist
          # Combine every per-binary .sha256 into one canonical file.
          # The install scripts download SHA256SUMS + their target binary,
          # grep the line for that binary, and verify locally.
          cat tracebloc-*.sha256 > SHA256SUMS
          rm tracebloc-*.sha256
          echo "Aggregated SHA256SUMS:"
          cat SHA256SUMS

      - name: Stage install scripts into the release
        run: |
          # The install.sh / install.ps1 ship inside the release so
          # `releases/latest/download/install.sh` resolves stably (the
          # raw scripts/ path would require knowing the tag).
          cp scripts/install.sh dist/
          cp scripts/install.ps1 dist/

      - name: Determine release tag
        id: tag
        env:
          # Pass the ref through the environment, never interpolate it into the
          # script. A tag name is attacker-controllable, so a crafted v* tag
          # carrying backticks or $() would otherwise execute on the publish
          # runner before the release is even created (R8). Same treatment the
          # guard and version steps above already got.
          REF_NAME: ${{ github.ref_name }}
        run: |
          REF="$REF_NAME"
          # STRICT stability rule: only a plain vX.Y.Z tag is a stable release.
          # Anything else (v1.2.3-rc.1, and typos like v1.2.3rc1) is marked
          # prerelease, so it can never become 'latest' -- which is what the
          # installer bootstrap (releases/latest/download/...) resolves.
          if printf '%s' "$REF" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$REF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          # Strict: only plain vX.Y.Z is stable (computed above); rc tags and
          # malformed variants are prereleases and never become 'latest'.
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          files: |
            dist/tracebloc-*
            dist/SHA256SUMS
            dist/install.sh
            dist/install.ps1
