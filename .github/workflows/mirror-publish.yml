# Mirror publish — feed the public, deliverable-only mirror of this repository.
#
# This repository is the DEVELOPMENT repo. Its public face is a separate mirror
# repository that carries only the deliverable: README / LICENSE / user docs on
# its default branch, and each GitHub release with its assets — the signed
# binaries, SHA256SUMS and the two installers. No Go source ever leaves. Nothing reaches the mirror except through this
# workflow, and nothing leaves this workflow except what scripts/publish-guard.sh
# staged and cleared — allowlist (.publish-include), forbidden paths and strings
# (.publish-forbidden), gitleaks. The guard's header states the rules; every
# guard fails closed, and "could not tell" never publishes.
#
# Triggers
#   workflow_run       after "Release" completes successfully. NOT on
#                      `release: published`: softprops/action-gh-release creates
#                      the release and then uploads the assets, so that event
#                      fires before the eight binaries and SHA256SUMS are all
#                      attached — a mirror cut then would copy a release with
#                      half its assets. The completed release workflow is the
#                      moment every asset exists. head_branch of a tag-push run
#                      is the tag (measured on v0.10.25 / -rc.2).
#   workflow_dispatch  `dry-run` (default TRUE) runs every guard, prints the
#                      staged file list and stops. `tag` names a published
#                      release whose assets are staged too (empty = tree only).
#                      `dry-run: false` with a tag publishes; it still refuses
#                      while no mirror is configured.
#
# Target
#   The mirror is named by the Actions VARIABLE `MIRROR_REPO` (a bare repo name
#   in this organisation), or the `mirror-repo` dispatch input. It has NO
#   default: until the mirror exists the job refuses to publish, and it always
#   refuses a target equal to this repository — publishing onto the source
#   would replace the default branch you are standing on.
#
# Credentials
#   RELEASE_TRAIN_APP_ID / RELEASE_TRAIN_APP_PRIVATE_KEY mint an installation
#   token scoped to the mirror only (permission contents:write); the default
#   GITHUB_TOKEN only reads this repo's release. PUBLISH_FORBIDDEN_TENANTS
#   carries the private needles for the string scan (one extended regex per
#   line — see .publish-forbidden for why they are not committed); the guard
#   refuses to run the scan without it.
name: Mirror publish

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to mirror (vX.Y.Z or vX.Y.Z-rc.N). Empty: stage the tree only."
        type: string
        default: ""
      dry-run:
        description: "Run every guard and print the staged file list without publishing"
        type: boolean
        default: true
      mirror-repo:
        description: "Mirror repository name in this organisation (overrides the MIRROR_REPO variable)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  publish:
    name: Guard, then publish to the mirror
    # A failed or cancelled release run publishes nothing; there is nothing to
    # mirror and a red run here would only point at the wrong workflow.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # One publish at a time, never cancelled midway: a half-pushed mirror is
    # worse than a late one.
    concurrency:
      group: mirror-publish
      cancel-in-progress: false
    env:
      # Every event field is read through env, never interpolated into a
      # script: a tag or branch name is attacker-shaped input.
      EVENT_NAME: ${{ github.event_name }}
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_DRY_RUN: ${{ inputs.dry-run }}
      INPUT_MIRROR: ${{ inputs.mirror-repo }}
      RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      VAR_MIRROR: ${{ vars.MIRROR_REPO }}
    steps:
      - name: Resolve what to publish
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            TAG="$RUN_HEAD_BRANCH"; DRY_RUN=false
          else
            TAG="$INPUT_TAG"; DRY_RUN="$INPUT_DRY_RUN"
          fi
          # Anything that is not exactly "false" is a dry run: fail closed.
          [ "$DRY_RUN" = "false" ] || DRY_RUN=true
          PRERELEASE=false
          if [ -n "$TAG" ]; then
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::'$TAG' is not a release tag — refusing to mirror it (a workflow_run whose head is a branch, or a mistyped dispatch)."
              exit 1
            fi
            # The release must be PUBLISHED here before it can be mirrored.
            if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease >"$RUNNER_TEMP/release.json"; then
              echo "::error::no release '$TAG' on $GITHUB_REPOSITORY — nothing to mirror."
              exit 1
            fi
            if [ "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" != "false" ]; then
              echo "::error::release '$TAG' is a draft — only published releases are mirrored."
              exit 1
            fi
            PRERELEASE="$(jq -r .isPrerelease "$RUNNER_TEMP/release.json")"
            REF="$TAG"
          else
            if [ "$DRY_RUN" != "true" ]; then
              echo "::error::a real publish needs a release tag; a tree-only run is dry-run only."
              exit 1
            fi
            REF="$GITHUB_SHA"
          fi
          {
            echo "tag=$TAG"
            echo "dry_run=$DRY_RUN"
            echo "ref=$REF"
            echo "prerelease=$PRERELEASE"
          } >>"$GITHUB_OUTPUT"
          echo "plan: event=$EVENT_NAME tag='${TAG:-<none>}' ref=$REF dry_run=$DRY_RUN prerelease=$PRERELEASE"

      - name: Check out the source at the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.plan.outputs.ref }}

      - name: Install gitleaks (pinned, checksum-verified)
        # Not preinstalled on ubuntu-latest. One pinned release, verified against
        # its published checksum before it runs: the guard treats a missing
        # scanner as "could not tell", so a failed install here is a red run,
        # never a silent skip.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 \
            -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          chmod 0755 "$RUNNER_TEMP/bin/gitleaks"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gitleaks" version

      - name: Write the private needle list
        # The secret is written to a file, never echoed. An unset secret yields
        # an empty file, which the guard refuses as "could not tell".
        env:
          PUBLISH_FORBIDDEN_TENANTS: ${{ secrets.PUBLISH_FORBIDDEN_TENANTS }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PUBLISH_FORBIDDEN_TENANTS" | sed '/^[[:space:]]*$/d' >"$RUNNER_TEMP/tenants.txt"
          echo "private needle list: $(grep -c . "$RUNNER_TEMP/tenants.txt" || true) entr(y/ies)"

      - name: Download the release assets
        if: steps.plan.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assets"
          ls -l "$RUNNER_TEMP/assets"

      - name: Guard the tree and the release assets
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -uo pipefail
          args=(--source . --out "$RUNNER_TEMP/stage" --extra-forbidden "$RUNNER_TEMP/tenants.txt")
          [ -z "$TAG" ] || args+=(--assets "$RUNNER_TEMP/assets")
          bash scripts/publish-guard.sh "${args[@]}" | tee "$RUNNER_TEMP/guard-tree.log"
          rc=${PIPESTATUS[0]}
          {
            echo "## Mirror publish — tree${TAG:+ + release $TAG}"
            echo
            echo '```'
            cat "$RUNNER_TEMP/guard-tree.log"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Dry run — stop here
        if: steps.plan.outputs.dry_run == 'true'
        run: |
          set -euo pipefail
          MIRROR="${INPUT_MIRROR:-$VAR_MIRROR}"
          echo "dry run: every guard passed; nothing was published."
          if [ -z "$MIRROR" ]; then
            echo "::notice::MIRROR_REPO is unset — a real run would refuse at the target check until the mirror repository exists and is named."
          else
            echo "a real run would publish to: $GITHUB_REPOSITORY_OWNER/$MIRROR"
          fi

      - name: Resolve the mirror repository
        if: steps.plan.outputs.dry_run != 'true'
        id: target
        run: |
          set -euo pipefail
          REPO="$(bash scripts/publish-mirror.sh target --mirror "${INPUT_MIRROR:-$VAR_MIRROR}" --source-repo "$GITHUB_REPOSITORY")"
          echo "repo=$REPO" >>"$GITHUB_OUTPUT"
          echo "name=${REPO#*/}" >>"$GITHUB_OUTPUT"
          echo "mirror: $REPO"

      - name: Mint a token scoped to the mirror
        if: steps.plan.outputs.dry_run != 'true'
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-contents: write

      - name: Confirm the mirror is a different, existing repository
        if: steps.plan.outputs.dry_run != 'true'
        id: mirror
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ steps.target.outputs.repo }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO" --jq '{full_name, default_branch, visibility}' >"$RUNNER_TEMP/mirror.json"
          FULL="$(jq -r .full_name "$RUNNER_TEMP/mirror.json")"
          if [ "$(printf '%s' "$FULL" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::error::mirror '$FULL' resolves to this repository — refusing."
            exit 1
          fi
          echo "default_branch=$(jq -r .default_branch "$RUNNER_TEMP/mirror.json")" >>"$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/mirror.json"

      - name: Push the tree to the mirror's default branch
        if: steps.plan.outputs.dry_run != 'true'
        id: push
        env:
          MIRROR_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ steps.target.outputs.repo }}
          BRANCH: ${{ steps.mirror.outputs.default_branch }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          # Credentials come from the helper, read from the environment; the
          # token is never part of a URL or a command line. The single quotes
          # are the point: $MIRROR_TOKEN expands when git runs the helper.
          # shellcheck disable=SC2016
          git config --global credential.helper '!f() { printf "username=x-access-token\npassword=%s\n" "$MIRROR_TOKEN"; }; f'
          OUT="$(bash scripts/publish-mirror.sh tree --stage "$RUNNER_TEMP/stage/tree" --repo "$REPO" --branch "$BRANCH" --message "Publish $TAG")"
          echo "$OUT"
          echo "sha=${OUT#* }" >>"$GITHUB_OUTPUT"

      - name: Create the release on the mirror
        if: steps.plan.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ steps.target.outputs.repo }}
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.push.outputs.sha }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Fixed notes, not the source release's generated ones: those list
          # merged pull requests by title, which is development history, not
          # the deliverable.
          {
            echo "tracebloc CLI $TAG."
            echo
            echo "Install with the one-liner in the README, or download a binary below and"
            echo "verify it against SHA256SUMS and its cosign .sig/.cert (recipe in the README)."
          } >"$RUNNER_TEMP/notes.md"
          args=(release --tag "$TAG" --repo "$REPO" --target "$SHA" --assets "$RUNNER_TEMP/stage/assets" --notes "$RUNNER_TEMP/notes.md")
          [ "$PRERELEASE" != "true" ] || args+=(--prerelease)
          bash scripts/publish-mirror.sh "${args[@]}"
